<!DOCTYPE html>
<html>
<head>
    <title>Spam Email Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <h1>📧 Spam Email Detector</h1>

        <form method="POST">
            <textarea
                name="message"
                placeholder="Enter your message here..."
                required
            ></textarea>

            <button type="submit">Predict</button>
        </form>

        {% if prediction %}
            <div class="result">
                {{ prediction }}
            </div>
        {% endif %}
    </div>
</body>
</html>
